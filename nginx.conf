worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=paper_cache:20m max_size=256m inactive=10m use_temp_path=off;
  upstream app { zone app 64k; server web:8000 resolve; keepalive 64; }
  server {
    listen 8080;
    client_max_body_size 1m;
    keepalive_timeout 10s;
    location / {
      limit_conn per_ip 30;
      limit_req zone=public_api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
    location ~ ^/api/(papers|dates)$ {
      limit_conn per_ip 30;
      limit_req zone=public_api burst=60 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_cache paper_cache;
      proxy_cache_lock on;
      proxy_cache_valid 200 60s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status;
    }
  }
}
