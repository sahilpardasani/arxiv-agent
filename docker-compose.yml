services:
  arxiv-agent:
    build: .
    container_name: arxiv-paper-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=America/New_York
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no
    volumes:
      - ./papers.json:/app/papers.json
      - ./papers_archive.json:/app/papers_archive.json
      - ./data:/app/data
      - ./.git:/app/.git
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s