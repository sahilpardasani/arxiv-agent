<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference AI Papers</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404060;
            --accent: #0099ff;
            --accent-light: #00d4ff;
            --success: #00c864;
            --success-light: #00ff88;
            --card-bg: rgba(30, 40, 60, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        html.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #d0d0d0;
            --accent: #0066cc;
            --accent-light: #0080ff;
            --success: #009900;
            --success-light: #00bb00;
            --card-bg: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(120deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
            min-width: 300px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--accent-light);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-light);
            transform: scale(1.02);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.05em;
        }

        /* ===== METRICS BAR ===== */
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .metric-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .metric-label {
            font-size: 0.75em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.6em;
            font-weight: 700;
            color: var(--accent-light);
        }

        .metric-value.up   { color: var(--success-light); }
        .metric-value.down { color: #ff6464; }
        .metric-value.same { color: var(--text-secondary); }

        .metric-sub {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ===== FILTERS ===== */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .glass-dropdown-wrapper {
            position: relative;
            width: 280px;
        }

        .glass-dropdown {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            appearance: none;
            width: 100%;
            position: relative;
            z-index: 20;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            font-family: inherit;
        }

        .glass-dropdown:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-dropdown:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 8px 32px rgba(0, 153, 255, 0.2);
        }

        .glass-dropdown-wrapper::after {
            content: '∨';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--accent-light);
            font-size: 0.8em;
            z-index: 25;
            font-weight: bold;
        }

        .glass-dropdown option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* ===== STATUS ===== */
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            white-space: normal;        /* ← add this */
            word-break: break-word; 
        }

        .status.loading {
            background: rgba(0, 150, 200, 0.15);
            color: var(--accent-light);
            border: 1px solid rgba(0, 150, 200, 0.3);
        }

        .status.error {
            background: rgba(255, 100, 100, 0.15);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        /* ===== PAPER CARDS ===== */
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .paper-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .paper-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 153, 255, 0.15);
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }

        .arxiv-link {
            display: inline-block;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--accent-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .arxiv-link:hover {
            background: rgba(0, 153, 255, 0.2);
            border-color: var(--accent-light);
            transform: scale(1.05);
        }

        .paper-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .paper-id {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .paper-date {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-style: italic;
        }

        .conference-badge {
            display: inline-block;
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid rgba(0, 200, 100, 0.3);
            color: var(--success-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .category-tag {
            display: inline-block;
            background: rgba(100, 150, 200, 0.15);
            border: 1px solid rgba(100, 150, 200, 0.3);
            color: var(--accent-light);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .bottleneck {
            color: var(--accent-light);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .problem {
            margin: 12px 0;
            font-size: 0.95em;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .summary {
            background: rgba(0, 100, 150, 0.1);
            border-left: 3px solid var(--accent);
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.6;
            color: var(--text-primary);
            border-radius: 6px;
        }

        .paper-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Conference AI Papers</h1>
            <div class="controls">
                <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
            </div>
        </div>

        <p class="subtitle">Daily digest of papers from NeurIPS, ICML, CVPR, ACL, and more — sorted by category & latest date</p>

        <!-- METRICS BAR -->
        <div class="metrics-bar" id="metricsBar" style="display:none;">
            <div class="metric-card">
                <div class="metric-label">📅 Date</div>
                <div class="metric-value" id="m-date" style="font-size:1.1em;">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">📄 Papers Today</div>
                <div class="metric-value" id="m-current">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">📆 Previous Day</div>
                <div class="metric-value" id="m-previous">—</div>
                <div class="metric-sub" id="m-previous-date">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">📈 Change</div>
                <div class="metric-value" id="m-change">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">📊 Trend</div>
                <div class="metric-value" id="m-trend">—</div>
            </div>
        </div>

        <div class="filters">
            <label class="filter-label">📅 Filter by Date:</label>
            <div class="glass-dropdown-wrapper">
                <select id="dateSelect" class="glass-dropdown" onchange="loadPapersByDate()">
                    <option value="">Loading dates...</option>
                </select>
            </div>

            <label class="filter-label">📚 Filter by Category:</label>
            <div class="glass-dropdown-wrapper">
                <select id="categorySelect" class="glass-dropdown">
                    <option value="">All Categories</option>
                </select>
            </div>
        </div>

        
        <div id="papers"></div>
    </div>

    <script>
        // ============ DARK/LIGHT MODE ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === null ? systemDark : savedTheme === 'dark';
            document.documentElement.classList.toggle('light-mode', !isDark);
            updateThemeButton(isDark);
        }

        function updateThemeButton(isDark) {
            document.getElementById('themeToggle').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const isLight = document.documentElement.classList.contains('light-mode');
            document.documentElement.classList.toggle('light-mode', !isLight);
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
            updateThemeButton(isLight);
        });

        initTheme();

        // ============ METRICS ============
        function renderMetrics(data) {
    const bar = document.getElementById('metricsBar');
    const dashboard = data?.metrics?.dashboard;
    if (!dashboard) { bar.style.display = 'none'; return; }

    bar.style.display = 'grid';

    // Works for both current and archive data
    const currentDate = dashboard.current_date || dashboard.date || data.filter_date || '—';
    const currentCount = dashboard.current_count ?? dashboard.total_papers ?? data.total_papers ?? '—';
    const previousCount = dashboard.previous_count ?? '—';
    const previousDate = dashboard.previous_date || '';
    const change = dashboard.day_change ?? null;
    const trend = dashboard.trend || (dashboard.note ? '📦 Archive' : '—');

    document.getElementById('m-date').textContent = currentDate;
    document.getElementById('m-current').textContent = currentCount;
    document.getElementById('m-previous').textContent = previousCount;
    document.getElementById('m-previous-date').textContent = previousDate;

    const changeEl = document.getElementById('m-change');
    if (change == null) {
        changeEl.textContent = '—';
        changeEl.className = 'metric-value';
    } else if (change > 0) {
        changeEl.textContent = `+${change}`;
        changeEl.className = 'metric-value up';
    } else if (change < 0) {
        changeEl.textContent = `${change}`;
        changeEl.className = 'metric-value down';
    } else {
        changeEl.textContent = '0';
        changeEl.className = 'metric-value same';
    }

    document.getElementById('m-trend').textContent = trend;
}

        // ============ LOAD DATES & PAPERS ============
        let allPapers = [];
        let categories = [];

        async function loadDates() {
            try {
                const response = await fetch('/api/dates');
                const data = await response.json();
                const dateSelect = document.getElementById('dateSelect');
                dateSelect.innerHTML = '';

                if (data.dates && Object.keys(data.dates).length > 0) {
                    Object.keys(data.dates).sort().reverse().forEach(date => {
                        const count = data.dates[date].count;
                        const option = document.createElement('option');
                        option.value = date;
                        option.textContent = `${date} (${count} papers)`;
                        dateSelect.appendChild(option);
                    });
                    loadPapersByDate();
                } else {
                    dateSelect.innerHTML = '<option>No dates available yet</option>';
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '❌ No data available yet. Run the analysis first.';
                }
            } catch (error) {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = `❌ Error loading dates: ${error.message}`;
            }
        }

        async function loadPapersByDate() {
            const dateSelect = document.getElementById('dateSelect');
            const selectedDate = dateSelect.value;
            if (!selectedDate) return;

            try {
                const response = await fetch(`/api/papers?date=${selectedDate}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                allPapers = data.papers || [];
                categories = data.categories || [];

                renderMetrics(data);

                if (allPapers.length === 0) {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '❌ No papers found for selected date';
                    document.getElementById('papers').innerHTML = '';
                    return;
                }

                populateCategories();
                renderPapers(allPapers);

            } catch (error) {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}`;
            }
        }

        function populateCategories() {
            const select = document.getElementById('categorySelect');
            while (select.options.length > 1) select.remove(1);

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });

            select.value = '';
            select.onchange = (e) => {
                const cat = e.target.value;
                renderPapers(cat ? allPapers.filter(i => i.conference_info?.category === cat) : allPapers);
            };
        }

        function formatDate(dateString) {
            try {
                return new Date(dateString).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });
            } catch { return dateString; }
        }

        function renderPapers(papers) {
            
            const papersEl = document.getElementById('papers');

            if (papers.length === 0) {
                
                papersEl.innerHTML = '';
                return;
            }

            

            const html = papers.map(item => {
                const analysis = item.analysis || {};
                const paper = item.paper || {};
                const ci = item.conference_info || {};
                const arxivId = paper.arxiv_id || '';
                const arxivUrl = `https://arxiv.org/abs/${arxivId}`;
                const confDisplay = ci.year && ci.year !== 'Unknown'
                    ? `${ci.conference} ${ci.year}` : ci.conference || 'Unknown';
                const published = paper.published ? formatDate(paper.published) : 'Unknown date';

                return `
                <div class="paper-card">
                    <div class="paper-header">
                        <div class="paper-title">${paper.title || 'Untitled'}</div>
                        <a href="${arxivUrl}" target="_blank" class="arxiv-link">📄 arXiv</a>
                    </div>
                    <div class="paper-meta-top">
                        <div class="paper-id">ID: ${arxivId}</div>
                        <div class="paper-date">📅 ${published}</div>
                    </div>
                    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
                        <div class="conference-badge">🏆 ${confDisplay}</div>
                        <div class="category-tag">${ci.category || 'Other'}</div>
                    </div>
                    ${analysis.bottleneck_addressed ? `<div class="bottleneck">🎯 ${analysis.bottleneck_addressed}</div>` : ''}
                    ${analysis.problem_statement ? `<div class="problem"><strong>Problem:</strong> ${analysis.problem_statement}</div>` : ''}
                    ${analysis.executive_summary ? `<div class="summary">${analysis.executive_summary}</div>` : ''}
                    ${analysis.key_metrics?.primary_metric ? `<div class="paper-meta"><strong>Key Metric:</strong> ${analysis.key_metrics.primary_metric}</div>` : ''}
                </div>`;
            }).join('');

            papersEl.innerHTML = `<div class="papers-grid">${html}</div>`;
        }

        window.addEventListener('load', loadDates);
    </script>
</body>
</html>
