<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference AI Papers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(120deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #b0b0b0; margin-bottom: 30px; }
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }
        .status.loading {
            background: rgba(0, 150, 200, 0.2);
            color: #00d4ff;
            border: 1px solid rgba(0, 150, 200, 0.5);
        }
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .paper-card {
            background: rgba(30, 40, 60, 0.8);
            border: 1px solid #404060;
            border-radius: 8px;
            padding: 24px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        .paper-card:hover {
            border-color: #0099ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 153, 255, 0.15);
        }
        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }
        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #ffffff;
            flex: 1;
        }
        .arxiv-link {
            display: inline-block;
            background: rgba(0, 153, 255, 0.2);
            border: 1px solid #0099ff;
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .arxiv-link:hover {
            background: rgba(0, 153, 255, 0.4);
            transform: scale(1.05);
        }
        .paper-id {
            font-size: 0.85em;
            color: #808080;
            margin-bottom: 12px;
            font-family: monospace;
        }
        .conference-badge {
            display: inline-block;
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid #00c864;
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .bottleneck { 
            color: #00d4ff; 
            font-weight: 600; 
            margin-bottom: 12px;
            font-size: 0.95em;
        }
        .problem { 
            margin: 12px 0; 
            font-size: 0.95em; 
            line-height: 1.5; 
        }
        .summary {
            background: rgba(0, 100, 150, 0.1);
            border-left: 3px solid #0099ff;
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .paper-meta {
            font-size: 0.85em;
            color: #a0a0a0;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 100, 150, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Conference AI Papers</h1>
        <p class="subtitle">Daily digest of papers from NeurIPS, ICML, CVPR, ACL, and more</p>
        <div class="status loading" id="status">Loading papers...</div>
        <div class="papers-grid" id="papers"></div>
    </div>

    <script>
        async function loadPapers() {
            try {
                console.log("Fetching from /api/papers...");
                const response = await fetch('/api/papers');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log("Data:", data);
                
                const papers = data.papers || [];
                console.log("Papers count:", papers.length);
                
                if (papers.length === 0) {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '❌ No papers found<br>Make sure papers.json has data and run: python3 arxiv_agent.py';
                    return;
                }
                
                document.getElementById('status').className = 'status loading';
                document.getElementById('status').textContent = `✅ Found ${papers.length} papers from top-tier conferences`;
                
                let html = '';
                papers.forEach((item, i) => {
                    const analysis = item.analysis || {};
                    const paper = item.paper || {};
                    const conference_info = item.conference_info || {};
                    
                    // Build arXiv URL
                    const arxivId = paper.arxiv_id || '';
                    const arxivUrl = `https://arxiv.org/abs/${arxivId}`;
                    
                    // Build conference display
                    const conferenceName = conference_info.conference || 'Unknown';
                    const conferenceYear = conference_info.year || '';
                    const conferenceDisplay = conferenceYear ? `${conferenceName} ${conferenceYear}` : conferenceName;
                    
                    html += `
                        <div class="paper-card">
                            <div class="paper-header">
                                <div class="paper-title">${paper.title || 'Untitled'}</div>
                                <a href="${arxivUrl}" target="_blank" class="arxiv-link">📄 arXiv</a>
                            </div>
                            
                            <div class="paper-id">ID: ${arxivId}</div>
                            
                            <div class="conference-badge">🏆 ${conferenceDisplay}</div>
                            
                            ${analysis.bottleneck_addressed ? `
                                <div class="bottleneck">🎯 ${analysis.bottleneck_addressed}</div>
                            ` : ''}
                            
                            ${analysis.problem_statement ? `
                                <div class="problem"><strong>Problem:</strong> ${analysis.problem_statement}</div>
                            ` : ''}
                            
                            ${analysis.executive_summary ? `
                                <div class="summary">${analysis.executive_summary}</div>
                            ` : ''}
                            
                            ${analysis.key_metrics?.primary_metric ? `
                                <div class="paper-meta"><strong>Key Metric:</strong> ${analysis.key_metrics.primary_metric}</div>
                            ` : ''}
                        </div>
                    `;
                });
                
                document.getElementById('papers').innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}<br>Check browser console (F12) for details`;
            }
        }
        
        loadPapers();
    </script>
</body>
</html>
