<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference AI Papers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(120deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #b0b0b0; margin-bottom: 30px; }
        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }
        .status.loading {
            background: rgba(0, 150, 200, 0.2);
            color: #00d4ff;
            border: 1px solid rgba(0, 150, 200, 0.5);
        }
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .paper-card {
            background: rgba(30, 40, 60, 0.8);
            border: 1px solid #404060;
            border-radius: 8px;
            padding: 24px;
            transition: all 0.3s;
        }
        .paper-card:hover {
            border-color: #0099ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 153, 255, 0.15);
        }
        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .paper-id {
            font-size: 0.85em;
            color: #808080;
            margin-bottom: 12px;
            font-family: monospace;
        }
        .bottleneck { color: #00d4ff; font-weight: 600; margin-bottom: 12px; }
        .problem { margin: 12px 0; font-size: 0.95em; line-height: 1.5; }
        .summary {
            background: rgba(0, 100, 150, 0.1);
            border-left: 3px solid #0099ff;
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Conference AI Papers</h1>
        <p class="subtitle">Daily digest of AI papers addressing bottlenecks</p>
        <div class="status loading" id="status">Loading papers...</div>
        <div class="papers-grid" id="papers"></div>
    </div>

    <script>
        async function loadPapers() {
            try {
                console.log("Fetching from /api/papers...");
                const response = await fetch('/api/papers');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log("Data:", data);
                
                const papers = data.papers || [];
                console.log("Papers count:", papers.length);
                
                if (papers.length === 0) {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '❌ No papers found<br>Make sure papers.json has data and run: python3 arxiv_agent.py';
                    return;
                }
                
                document.getElementById('status').className = 'status loading';
                document.getElementById('status').textContent = `✅ Found ${papers.length} papers`;
                
                let html = '';
                papers.forEach((item, i) => {
                    const analysis = item.analysis || {};
                    const paper = item.paper || {};
                    
                    html += `
                        <div class="paper-card">
                            <div class="paper-title">${paper.title || 'Untitled'}</div>
                            <div class="paper-id">📄 ${paper.arxiv_id || 'N/A'}</div>
                            
                            ${analysis.bottleneck_addressed ? `
                                <div class="bottleneck">🎯 ${analysis.bottleneck_addressed}</div>
                            ` : ''}
                            
                            ${analysis.problem_statement ? `
                                <div class="problem"><strong>Problem:</strong> ${analysis.problem_statement}</div>
                            ` : ''}
                            
                            ${analysis.executive_summary ? `
                                <div class="summary">${analysis.executive_summary}</div>
                            ` : ''}
                            
                            ${analysis.key_metrics?.primary_metric ? `
                                <div><strong>Key Metric:</strong> ${analysis.key_metrics.primary_metric}</div>
                            ` : ''}
                        </div>
                    `;
                });
                
                document.getElementById('papers').innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}<br>Check browser console (F12) for details`;
            }
        }
        
        loadPapers();
    </script>
</body>
</html>
