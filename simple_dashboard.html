<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference AI Papers</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404060;
            --accent: #0099ff;
            --accent-light: #00d4ff;
            --success: #00c864;
            --success-light: #00ff88;
            --card-bg: rgba(30, 40, 60, 0.8);
        }

        html.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #d0d0d0;
            --accent: #0066cc;
            --accent-light: #0080ff;
            --success: #009900;
            --success-light: #00bb00;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(120deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
            min-width: 300px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle {
            background: rgba(0, 153, 255, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent-light);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(0, 153, 255, 0.4);
            transform: scale(1.05);
        }

        .subtitle { 
            text-align: center; 
            color: var(--text-secondary); 
            margin-bottom: 20px;
            font-size: 1.05em;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .category-filter {
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-filter:hover {
            border-color: var(--accent);
            background: rgba(0, 153, 255, 0.1);
        }

        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .status.loading {
            background: rgba(0, 150, 200, 0.2);
            color: var(--accent-light);
            border: 1px solid rgba(0, 150, 200, 0.5);
        }

        .status.error {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }

        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .paper-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .paper-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 153, 255, 0.15);
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .arxiv-link {
            display: inline-block;
            background: rgba(0, 153, 255, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent-light);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .arxiv-link:hover {
            background: rgba(0, 153, 255, 0.4);
            transform: scale(1.05);
        }

        .paper-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .paper-id {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .paper-date {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-style: italic;
        }

        .conference-badge {
            display: inline-block;
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid var(--success);
            color: var(--success-light);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .category-tag {
            display: inline-block;
            background: rgba(100, 150, 200, 0.2);
            border: 1px solid rgba(100, 150, 200, 0.5);
            color: var(--accent-light);
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .bottleneck { 
            color: var(--accent-light);
            font-weight: 600; 
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .problem { 
            margin: 12px 0; 
            font-size: 0.95em; 
            line-height: 1.5;
            color: var(--text-primary);
        }

        .summary {
            background: rgba(0, 100, 150, 0.1);
            border-left: 3px solid var(--accent);
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .paper-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Conference AI Papers</h1>
            <div class="controls">
                <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
            </div>
        </div>

        <p class="subtitle">Daily digest of papers from NeurIPS, ICML, CVPR, ACL, and more — sorted by category & latest date</p>
        
        <div class="filters">
            <label class="filter-label">📚 Filter by Category:</label>
            <select id="categorySelect" class="category-filter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div class="status loading" id="status">Loading papers...</div>
        <div id="papers"></div>
    </div>

    <script>
        // ============ DARK/LIGHT MODE ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === null ? systemDark : savedTheme === 'dark';
            
            document.documentElement.classList.toggle('light-mode', !isDark);
            updateThemeButton(isDark);
        }

        function updateThemeButton(isDark) {
            const btn = document.getElementById('themeToggle');
            btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const html = document.documentElement;
            const isLight = html.classList.contains('light-mode');
            
            html.classList.toggle('light-mode', !isLight);
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
            updateThemeButton(isLight);
        });

        initTheme();

        // ============ LOAD & FILTER PAPERS ============
        let allPapers = [];
        let categories = [];

        async function loadPapers() {
            try {
                const response = await fetch('/api/papers');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                allPapers = data.papers || [];
                categories = data.categories || [];
                
                if (allPapers.length === 0) {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').innerHTML = '❌ No papers found<br>Make sure papers.json has data and run: python3 arxiv_agent.py';
                    return;
                }
                
                populateCategories();
                renderPapers(allPapers);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}<br>Check browser console (F12) for details`;
            }
        }

        function populateCategories() {
            const select = document.getElementById('categorySelect');
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                const selectedCategory = e.target.value;
                if (selectedCategory === '') {
                    renderPapers(allPapers);
                } else {
                    const filtered = allPapers.filter(item => 
                        item.conference_info?.category === selectedCategory
                    );
                    renderPapers(filtered);
                }
            });
        }

        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
            } catch {
                return dateString;
            }
        }

        function renderPapers(papers) {
            const statusEl = document.getElementById('status');
            const papersEl = document.getElementById('papers');
            
            if (papers.length === 0) {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ No papers found in selected category';
                papersEl.innerHTML = '';
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = `✅ Found ${papers.length} papers (sorted by category & latest date)`;
            
            let html = '';
            papers.forEach((item) => {
                const analysis = item.analysis || {};
                const paper = item.paper || {};
                const conference_info = item.conference_info || {};
                
                const arxivId = paper.arxiv_id || '';
                const arxivUrl = `https://arxiv.org/abs/${arxivId}`;
                
                const conferenceName = conference_info?.conference || 'Unknown';
                const conferenceYear = conference_info?.year || 'Unknown';
                const conferenceDisplay = (conferenceYear && conferenceYear !== 'Unknown') 
                    ? `${conferenceName} ${conferenceYear}` 
                    : conferenceName;
                
                const category = conference_info?.category || 'Other';
                const published = paper.published ? formatDate(paper.published) : 'Unknown date';
                
                html += `
                    <div class="paper-card">
                        <div class="paper-header">
                            <div class="paper-title">${paper.title || 'Untitled'}</div>
                            <a href="${arxivUrl}" target="_blank" class="arxiv-link">📄 arXiv</a>
                        </div>
                        
                        <div class="paper-meta-top">
                            <div class="paper-id">ID: ${arxivId}</div>
                            <div class="paper-date">📅 ${published}</div>
                        </div>
                        
                        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                            <div class="conference-badge">🏆 ${conferenceDisplay}</div>
                            <div class="category-tag">${category}</div>
                        </div>
                        
                        ${analysis.bottleneck_addressed ? `
                            <div class="bottleneck">🎯 ${analysis.bottleneck_addressed}</div>
                        ` : ''}
                        
                        ${analysis.problem_statement ? `
                            <div class="problem"><strong>Problem:</strong> ${analysis.problem_statement}</div>
                        ` : ''}
                        
                        ${analysis.executive_summary ? `
                            <div class="summary">${analysis.executive_summary}</div>
                        ` : ''}
                        
                        ${analysis.key_metrics?.primary_metric ? `
                            <div class="paper-meta"><strong>Key Metric:</strong> ${analysis.key_metrics.primary_metric}</div>
                        ` : ''}
                    </div>
                `;
            });
            
            papersEl.innerHTML = html ? `<div class="papers-grid">${html}</div>` : '<div class="no-results">No papers to display</div>';
        }

        loadPapers();
    </script>
</body>
</html>
