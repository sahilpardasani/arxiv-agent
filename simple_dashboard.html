<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Digest</title>
    <script>
        try {
            const saved = localStorage.getItem('theme');
            const useDark = saved === null ? matchMedia('(prefers-color-scheme: dark)').matches : saved === 'dark';
            document.documentElement.classList.toggle('light-mode', !useDark);
        } catch (_) {}
    </script>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404060;
            --accent: #0099ff;
            --accent-light: #00d4ff;
            --success: #00c864;
            --success-light: #00ff88;
            --danger: #ff7474;
            --focus-ring: #7dd3fc;
            --card-bg: rgba(30, 40, 60, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        html.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #d0d0d0;
            --accent: #0066cc;
            --accent-light: #0080ff;
            --success: #009900;
            --success-light: #00bb00;
            --danger: #c62828;
            --focus-ring: #0066cc;
            --card-bg: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 28px 20px 60px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1280px; margin: 0 auto; }

        .skip-link {
            position: fixed; left: 16px; top: -60px; z-index: 100;
            background: var(--accent); color: white; padding: 10px 14px;
            border-radius: 8px; text-decoration: none; font-weight: 700;
        }
        .skip-link:focus { top: 12px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            background: linear-gradient(120deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
            min-width: min(100%, 300px);
        }

        .eyebrow { color: var(--accent-light); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle, .secondary-button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--accent-light);
            min-height: 44px;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .theme-toggle:hover, .secondary-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-light);
            transform: scale(1.02);
        }

        button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
            outline: 3px solid var(--focus-ring); outline-offset: 3px;
        }

        .subtitle {
            text-align: left;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.05em;
            max-width: 760px;
        }

        /* ===== ERROR BANNER ===== */
        .error-banner {
            display: none;
            padding: 14px 18px;
            margin-bottom: 16px;
            border-radius: 10px;
            background: rgba(255, 100, 100, 0.15);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.3);
            text-align: left;
            font-size: 0.95em;
        }

        .error-banner button { margin-left: 12px; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 6px; padding: 6px 10px; cursor: pointer; }

        /* ===== METRICS BAR ===== */
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: left;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .metric-label {
            font-size: 0.75em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 1.6em;
            font-weight: 700;
            color: var(--accent-light);
        }

        .metric-value.up   { color: var(--success-light); }
        .metric-value.down { color: #ff6464; }
        .metric-value.same { color: var(--text-secondary); }

        .metric-sub {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ===== FILTERS ===== */
        .filter-panel {
            position: sticky; top: 12px; z-index: 40;
            background: color-mix(in srgb, var(--bg-secondary) 92%, transparent);
            border: 1px solid var(--border-color); border-radius: 14px;
            padding: 14px; margin-bottom: 18px;
            box-shadow: 0 12px 36px rgba(0,0,0,.16);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(150px, 1fr)) auto;
            gap: 10px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            align-items: stretch;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .filter-label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.9em;
            white-space: nowrap;
        }

        .glass-dropdown-wrapper {
            position: relative;
            width: 100%;
        }

        .glass-dropdown-wrapper.narrow {
            width: 100%;
        }

        .glass-dropdown {
            min-height: 44px;
            padding: 10px 38px 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            appearance: none;
            width: 100%;
            position: relative;
            z-index: 20;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            font-family: inherit;
        }

        .search-input {
            width: 100%; min-height: 44px; border-radius: 10px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: var(--text-primary); padding: 10px 12px; font: inherit;
        }
        .search-input::placeholder { color: var(--text-secondary); }
        .secondary-button { color: var(--text-primary); white-space: nowrap; }
        .secondary-button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        .results-bar { display:flex; justify-content:space-between; gap:12px; align-items:center; min-height:32px; margin-bottom:14px; color:var(--text-secondary); }
        .results-count { font-weight:700; color:var(--text-primary); }
        .keyboard-hint { font-size:.8rem; }

        .glass-dropdown:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .glass-dropdown:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 8px 32px rgba(0, 153, 255, 0.2);
        }

        .glass-dropdown-wrapper::after {
            content: '∨';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--accent-light);
            font-size: 0.8em;
            z-index: 25;
            font-weight: bold;
        }

        .glass-dropdown option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* ===== PAPER CARDS ===== */
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
            gap: 20px;
        }

        .paper-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .paper-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 153, 255, 0.15);
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .paper-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }

        .paper-title a { color: inherit; text-decoration: none; }
        .paper-title a:hover { color: var(--accent-light); text-decoration: underline; text-underline-offset: 3px; }

        .arxiv-link {
            display: inline-block;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--accent-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .arxiv-link:hover {
            background: rgba(0, 153, 255, 0.2);
            border-color: var(--accent-light);
            transform: scale(1.05);
        }

        .paper-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .paper-id {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .paper-date {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-style: italic;
        }

        .conference-badge {
            display: inline-block;
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid rgba(0, 200, 100, 0.3);
            color: var(--success-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .category-tag {
            display: inline-block;
            background: rgba(100, 150, 200, 0.15);
            border: 1px solid rgba(100, 150, 200, 0.3);
            color: var(--accent-light);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .bottleneck {
            color: var(--accent-light);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.95em;
        }

        .problem {
            margin: 12px 0;
            font-size: 0.95em;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .summary {
            background: rgba(0, 100, 150, 0.1);
            border-left: 3px solid var(--accent);
            padding: 12px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.6;
            color: var(--text-primary);
            border-radius: 6px;
        }

        .paper-meta {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .authors { color: var(--text-secondary); font-size: .84rem; line-height: 1.45; margin: -4px 0 12px; }
        .analysis-details { margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .analysis-details summary { color: var(--accent-light); cursor: pointer; font-weight: 700; padding: 6px 0; }
        .analysis-details summary:hover { text-decoration: underline; text-underline-offset: 3px; }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .no-results h2 { color: var(--text-primary); margin-bottom: 8px; font-size: 1.25rem; }
        .loading-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .skeleton { min-height:280px; border-radius:12px; border:1px solid var(--border-color); background:linear-gradient(90deg,var(--card-bg),var(--glass-bg),var(--card-bg)); background-size:200% 100%; animation:shimmer 1.4s infinite; }
        @keyframes shimmer { to { background-position:-200% 0; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
        }

        @media (max-width: 980px) {
            .filters { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .filter-group.search-group { grid-column: 1 / -1; }
            .loading-grid { grid-template-columns:repeat(2,1fr); }
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 640px) {
            body { padding: 16px 12px 40px; }

            h1 { font-size: 1.6em; min-width: unset; }

            .header { gap: 10px; margin-bottom: 14px; }

            .subtitle { font-size: 0.9em; margin-bottom: 14px; }

            .metrics-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                margin-bottom: 14px;
            }

            .metric-card { padding: 10px 12px; }
            .metric-value { font-size: 1.3em; }
            .metric-label { font-size: 0.7em; }

            .filter-panel { position:static; padding:12px; }
            .filters { grid-template-columns:1fr; gap:10px; }
            .filter-group.search-group { grid-column:auto; }

            .filter-group {
                width: 100%;
            }

            .glass-dropdown-wrapper,
            .glass-dropdown-wrapper.narrow { width: 100%; }

            .papers-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .paper-card { padding: 16px; }

            .paper-title { font-size: 1em; }

            .paper-header {
                flex-direction: column;
                gap: 8px;
            }

            .arxiv-link { align-self: flex-start; }

            .conference-badge { font-size: 0.8em; padding: 5px 10px; }
            .metrics-bar .metric-card:last-child { grid-column:1/-1; }
            .loading-grid { grid-template-columns:1fr; }
            .keyboard-hint { display:none; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#papers">Skip to papers</a>
    <main class="container">
        <header class="header">
            <div>
                <div class="eyebrow">Curated daily</div>
                <h1>AI Research Digest</h1>
            </div>
            <div class="controls">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch color theme">Dark mode</button>
            </div>
        </header>

        <p class="subtitle">Important conference papers, distilled into the problem, approach, and result—so you can decide what deserves a deeper read.</p>

        <!-- METRICS BAR -->
        <div class="metrics-bar" id="metricsBar" style="display:none;">
            <div class="metric-card">
                <div class="metric-label">Digest date</div>
                <div class="metric-value" id="m-date" style="font-size:1.1em;">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Curated papers</div>
                <div class="metric-value" id="m-current">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Compared with prior digest</div>
                <div class="metric-value same" id="m-change">—</div>
                <div class="metric-sub" id="m-previous-date">—</div>
            </div>
        </div>

        <div class="error-banner" id="errorBanner" role="alert" aria-live="assertive"></div>

        <section class="filter-panel" aria-label="Filter papers">
        <div class="filters">
            <div class="filter-group search-group">
                <label class="filter-label" for="searchInput">Search</label>
                <input id="searchInput" class="search-input" type="search" placeholder="Title, conference, topic…" autocomplete="off">
            </div>
            <div class="filter-group">
                <label class="filter-label" for="dateSelect">Digest date</label>
                <div class="glass-dropdown-wrapper">
                    <select id="dateSelect" class="glass-dropdown">
                        <option value="">Loading dates...</option>
                    </select>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="categorySelect">Category</label>
                <div class="glass-dropdown-wrapper">
                    <select id="categorySelect" class="glass-dropdown">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="rankSelect">Conference rank</label>
                <div class="glass-dropdown-wrapper narrow">
                    <select id="rankSelect" class="glass-dropdown">
                        <option value="">All</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
            </div>
            <button class="secondary-button" id="clearFilters" type="button" disabled>Clear</button>
        </div>
        </section>

        <div class="results-bar">
            <div id="resultsCount" class="results-count" role="status" aria-live="polite">Loading papers…</div>
            <div class="keyboard-hint">Press <strong>/</strong> to search</div>
        </div>
        <div id="papers" aria-busy="true">
            <div class="loading-grid" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
    </main>

    <script>
        // ============ DARK/LIGHT MODE ============
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === null ? systemDark : savedTheme === 'dark';
            document.documentElement.classList.toggle('light-mode', !isDark);
            updateThemeButton(isDark);
        }

        function updateThemeButton(isDark) {
            const button = document.getElementById('themeToggle');
            button.textContent = isDark ? 'Light mode' : 'Dark mode';
            button.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const isLight = document.documentElement.classList.contains('light-mode');
            document.documentElement.classList.toggle('light-mode', !isLight);
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
            updateThemeButton(isLight);
        });

        initTheme();

        // ============ ERROR BANNER ============
        function showError(msg, retry) {
            const banner = document.getElementById('errorBanner');
            banner.replaceChildren(document.createTextNode(msg));
            if (retry) {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = 'Try again';
                button.addEventListener('click', retry, { once: true });
                banner.appendChild(button);
            }
            banner.style.display = 'block';
        }

        function hideError() {
            const banner = document.getElementById('errorBanner');
            banner.style.display = 'none';
        }

        // ============ METRICS ============
        function renderMetrics(data) {
            const bar = document.getElementById('metricsBar');
            const dashboard = data?.metrics?.dashboard;
            if (!dashboard) { bar.style.display = 'none'; return; }

            bar.style.display = 'grid';

            const currentDate = dashboard.current_date || dashboard.date || data.filter_date || '—';
            const currentCount = dashboard.current_count ?? dashboard.total_papers ?? data.total_papers ?? '—';
            const previousDate = dashboard.previous_date || '';
            const change = dashboard.day_change ?? null;

            document.getElementById('m-date').textContent = currentDate;
            document.getElementById('m-current').textContent = currentCount;
            document.getElementById('m-previous-date').textContent = previousDate ? `Previous digest: ${previousDate}` : '';

            const changeEl = document.getElementById('m-change');
            if (change == null) {
                changeEl.textContent = '—';
                changeEl.className = 'metric-value same';
            } else if (change > 0) {
                changeEl.textContent = `${change} more`;
                changeEl.className = 'metric-value same';
            } else if (change < 0) {
                changeEl.textContent = `${Math.abs(change)} fewer`;
                changeEl.className = 'metric-value same';
            } else {
                changeEl.textContent = 'Same count';
                changeEl.className = 'metric-value same';
            }
        }

        // ============ RANK LOOKUP TABLE ============
        // Mirrors CONFERENCE_RANKS in arxiv_agent.py exactly.
        // Only conferences confirmed in the official CORE ranking list are ranked.
        // Conferences not in the official list return "" (no rank badge shown).
        const CONFERENCE_RANKS = {
            // A+
            "ACL":"A+",  "Association for Computational Linguistics":"A+",
            "ACMMM":"A+", "ACM Multimedia":"A+",
            "ASPLOS":"A+",
            "CCS":"A+",  "ACM CCS":"A+",
            "CHI":"A+",  "ACM Conference on Human Factors in Computing Systems":"A+",
            "FOCS":"A+",
            "ICCV":"A+", "IEEE International Conference on Computer Vision":"A+",
            "ICDE":"A+",
            "ICDM":"A+",
            "ICML":"A+",
            "ICSE":"A+", "International Conference on Software Engineering":"A+",
            "IJCAI":"A+",
            "KDD":"A+",  "SIGKDD":"A+",
            "NIPS":"A+", "NeurIPS":"A+", "NEURIPS":"A+",
            "OSDI":"A+", "Operating Systems Design and Implementation":"A+",
            "PODS":"A+",
            "RSS":"A+",
            "SIGCOMM":"A+",
            "SIGIR":"A+",
            "SIGMOD":"A+",
            "SODA":"A+",
            "SOSP":"A+", "Symposium on Operating Systems Principles":"A+",
            "STOC":"A+",
            "UAI":"A+",
            "VLDB":"A+",
            "WWW":"A+",
            // A
            "ALIFE":"A", "International Conference on Artificial Life":"A",
            "BMVC":"A",
            "COLING":"A",
            "CVPR":"A",  "IEEE/CVF Conference on Computer Vision":"A",
            "DASFAA":"A", "Database Systems for Advanced Applications":"A",
            "EACL":"A",
            "EASE":"A",  "Empirical Assessment of Software Engineering":"A",
            "ECAI":"A",
            "ECCV":"A",  "European Conference on Computer Vision":"A",
            "EMNLP":"A", "Empirical Methods in Natural Language Processing":"A",
            "EuroSys":"A",
            "FSE":"A",
            "FUZZ-IEEE":"A", "IEEE International Conference on Fuzzy Systems":"A",
            "ICCAD":"A", "International Conference on Computer-Aided Design":"A", "IEEE/ACM International Conference On Computer Aided Design":"A",
            "IJCNN":"A", "IEEE IJCNN":"A", "International Joint Conference on Neural Networks":"A",
            "IROS":"A",  "Intelligent Robots and Systems":"A",
            "MICCAI":"A", "International Conference on Medical Image Computing and Computer Assisted Intervention":"A",
            "NAACL":"A", "North American Chapter of the Association for Computational Linguistics":"A",
            "NDSS":"A",
            "NSDI":"A",
            "USENIX":"A", "USENIX Annual Technical Conference":"A",
            "USENIX-Security":"A", "USENIX Security":"A",
            "WACV":"A",
            // B
            "DAC":"B",   "Design Automation Conference":"B", "ACM/IEEE Design Automation Conference":"B",
            "GECCO":"B", "Genetic and Evolutionary Computation Conference":"B",
            "ICASSP":"B", "IEEE International Conference on Acoustics, Speech and Signal Processing":"B",
            "ICRA":"B",  "International Conference on Robotics and Automation":"B",
            // C
            "LREC":"C",  "Language Resources and Evaluation":"C",
            // Blockchain — not in official list, conservative B
            "ICBC":"B",  "IEEE International Conference on Blockchain and Cryptocurrency":"B",
            "ISBCom":"B", "International Conference on Intelligent Systems, Blockchain, and Communication Technologies":"B",
            "Financial Cryptography":"B",
            "Financial Cryptography and Data Security":"B",
            "IEEE Conference on ICT in Business Industry & Government":"B",
        };

        function backfillRank(papers) {
            return papers.map(item => {
                const ci = item.conference_info;
                if (ci && !ci.rank) {
                    ci.rank = CONFERENCE_RANKS[ci.conference] || "";
                }
                return item;
            });
        }

        // ============ LOAD DATES & PAPERS ============
        let allPapers = [];
        let categories = [];
        let papersRequest = null;

        const controls = {
            date: document.getElementById('dateSelect'),
            category: document.getElementById('categorySelect'),
            rank: document.getElementById('rankSelect'),
            search: document.getElementById('searchInput'),
            clear: document.getElementById('clearFilters'),
        };

        function setLoading(isLoading) {
            document.getElementById('papers').setAttribute('aria-busy', String(isLoading));
            controls.date.disabled = isLoading;
            if (isLoading) {
                document.getElementById('resultsCount').textContent = 'Loading papers…';
                document.getElementById('papers').innerHTML = '<div class="loading-grid" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
            }
        }

        function syncUrl() {
            const params = new URLSearchParams();
            if (controls.date.value) params.set('date', controls.date.value);
            if (controls.category.value) params.set('category', controls.category.value);
            if (controls.rank.value) params.set('rank', controls.rank.value);
            if (controls.search.value.trim()) params.set('q', controls.search.value.trim());
            const queryString = params.toString();
            history.replaceState(null, '', `${location.pathname}${queryString ? `?${queryString}` : ''}`);
        }

        // API data includes third-party arXiv metadata and AI-generated text.
        // Treat all of it as untrusted before inserting it into an HTML string.
        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        async function loadDates() {
            try {
                const response = await fetch('/api/dates');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const dateSelect = controls.date;
                dateSelect.innerHTML = '';

                if (data.dates && Object.keys(data.dates).length > 0) {
                    Object.keys(data.dates).sort().reverse().forEach(d => {
                        const count = data.dates[d].count;
                        const option = document.createElement('option');
                        option.value = d;
                        option.textContent = `${d} (${count} papers)`;
                        dateSelect.appendChild(option);
                    });
                    const requestedDate = new URLSearchParams(location.search).get('date');
                    if (requestedDate && [...dateSelect.options].some(option => option.value === requestedDate)) dateSelect.value = requestedDate;
                    await loadPapersByDate();
                } else {
                    const option = document.createElement('option');
                    option.textContent = 'No dates available';
                    dateSelect.replaceChildren(option);
                    document.getElementById('resultsCount').textContent = 'No papers available';
                    renderEmpty('No digest yet', 'The first curated digest will appear here after analysis runs.');
                }
            } catch (error) {
                document.getElementById('resultsCount').textContent = 'Unable to load';
                showError('We could not load the available dates.', loadDates);
                renderEmpty('Something went wrong', 'Check your connection and try again.');
            }
        }

        async function loadPapersByDate() {
            const dateSelect = controls.date;
            const selectedDate = dateSelect.value;
            if (!selectedDate) return;

            hideError();
            if (papersRequest) papersRequest.abort();
            papersRequest = new AbortController();
            setLoading(true);

            try {
                const response = await fetch(`/api/papers?date=${encodeURIComponent(selectedDate)}`, { signal: papersRequest.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                allPapers = backfillRank(data.papers || []);
                categories = data.categories || [];

                renderMetrics(data);

                if (allPapers.length === 0) {
                    renderEmpty('No papers in this digest', 'Choose another date to keep exploring.');
                    document.getElementById('resultsCount').textContent = '0 papers';
                    return;
                }

                populateCategories();
                const params = new URLSearchParams(location.search);
                const requestedCategory = params.get('category');
                if (requestedCategory && [...controls.category.options].some(option => option.value === requestedCategory)) controls.category.value = requestedCategory;
                controls.rank.value = params.get('rank') || '';
                controls.search.value = params.get('q') || '';
                applyFilters();

            } catch (error) {
                if (error.name === 'AbortError') return;
                document.getElementById('resultsCount').textContent = 'Unable to load';
                showError('We could not load this digest.', loadPapersByDate);
                renderEmpty('Something went wrong', 'Check your connection and try again.');
            } finally {
                document.getElementById('papers').setAttribute('aria-busy', 'false');
                controls.date.disabled = false;
            }
        }

        function populateCategories() {
            const select = controls.category;
            while (select.options.length > 1) select.remove(1);

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });

            select.value = '';
        }

        function applyFilters() {
            const cat = controls.category.value;
            const rank = controls.rank.value;
            const query = controls.search.value.trim().toLowerCase();

            let filtered = allPapers;
            if (cat) {
                filtered = filtered.filter(i => (i.conference_info?.category || '') === cat);
            }
            if (rank) {
                filtered = filtered.filter(i => (i.conference_info?.rank || '') === rank);
            }
            if (query) {
                filtered = filtered.filter(item => {
                    const paper = item.paper || {};
                    const analysis = item.analysis || {};
                    const conference = item.conference_info || {};
                    const fields = [paper.title, paper.authors?.join(' '), conference.conference, conference.category,
                        analysis.problem_statement, analysis.bottleneck_addressed, analysis.executive_summary,
                        analysis.relevance_tags?.join(' ')];
                    return fields.some(value => String(value || '').toLowerCase().includes(query));
                });
            }
            controls.clear.disabled = !cat && !rank && !query;
            renderPapers(filtered);
            syncUrl();
        }

        controls.date.addEventListener('change', loadPapersByDate);
        controls.category.addEventListener('change', applyFilters);
        controls.rank.addEventListener('change', applyFilters);
        controls.search.addEventListener('input', applyFilters);
        controls.clear.addEventListener('click', () => {
            controls.category.value = '';
            controls.rank.value = '';
            controls.search.value = '';
            applyFilters();
            controls.search.focus();
        });
        document.addEventListener('keydown', event => {
            if (event.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                event.preventDefault();
                controls.search.focus();
            }
        });

        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                if (Number.isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });
            } catch { return dateString; }
        }

        function rankBadgeHtml(rank) {
            if (!rank) return '';
            const colors = {
                'A+': 'rgba(255, 200, 0, 0.18)',
                'A':  'rgba(0, 200, 100, 0.15)',
                'B':  'rgba(100, 150, 255, 0.15)',
                'C':  'rgba(180, 180, 180, 0.15)',
            };
            const borders = {
                'A+': 'rgba(255, 200, 0, 0.5)',
                'A':  'rgba(0, 200, 100, 0.4)',
                'B':  'rgba(100, 150, 255, 0.4)',
                'C':  'rgba(180, 180, 180, 0.4)',
            };
            const textColors = {
                'A+': '#ffd700',
                'A':  '#00c864',
                'B':  '#6699ff',
                'C':  '#aaaaaa',
            };
            const bg = colors[rank] || 'rgba(150,150,150,0.1)';
            const br = borders[rank] || 'rgba(150,150,150,0.3)';
            const tc = textColors[rank] || '#aaaaaa';
            return `<span style="display:inline-block;background:${bg};border:1px solid ${br};color:${tc};padding:3px 9px;border-radius:5px;font-size:0.75em;font-weight:700;letter-spacing:0.05em;">${escapeHtml(rank)}</span>`;
        }

        function renderEmpty(title, message) {
            document.getElementById('papers').innerHTML = `<div class="no-results"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p></div>`;
        }

        function authorLine(authors) {
            if (!Array.isArray(authors) || authors.length === 0) return '';
            const visible = authors.slice(0, 3).join(', ');
            return authors.length > 3 ? `${visible} +${authors.length - 3} more` : visible;
        }

        function renderPapers(papers) {
            const papersEl = document.getElementById('papers');

            if (papers.length === 0) {
                document.getElementById('resultsCount').textContent = '0 papers';
                renderEmpty('No matching papers', 'Try a broader search or clear one of the filters.');
                return;
            }

            const total = allPapers.length;
            document.getElementById('resultsCount').textContent = papers.length === total
                ? `${total} ${total === 1 ? 'paper' : 'papers'}`
                : `${papers.length} of ${total} papers`;

            const html = papers.map(item => {
                const analysis = item.analysis || {};
                const paper = item.paper || {};
                const ci = item.conference_info || {};
                const arxivId = String(paper.arxiv_id || '');
                const safeArxivId = /^[a-z0-9.\/-]+$/i.test(arxivId) ? arxivId : '';
                const arxivUrl = `https://arxiv.org/abs/${encodeURIComponent(safeArxivId)}`;
                const confDisplay = ci.year && ci.year !== 'Unknown'
                    ? `${ci.conference} ${ci.year}` : ci.conference || 'Unknown';
                const published = paper.published ? formatDate(paper.published) : 'Unknown date';
                const rank = ci.rank || '';
                const authors = authorLine(paper.authors);

                return `
                <article class="paper-card">
                    <div class="paper-header">
                        <h2 class="paper-title"><a href="${arxivUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(paper.title || 'Untitled')}</a></h2>
                        <a href="${arxivUrl}" target="_blank" rel="noopener noreferrer" class="arxiv-link" aria-label="Open ${escapeHtml(paper.title || 'paper')} on arXiv">arXiv ↗</a>
                    </div>
                    ${authors ? `<div class="authors">${escapeHtml(authors)}</div>` : ''}
                    <div class="paper-meta-top">
                        <div class="paper-id">ID: ${escapeHtml(arxivId)}</div>
                        <div class="paper-date">${escapeHtml(published)}</div>
                    </div>
                    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
                        <div class="conference-badge">${escapeHtml(confDisplay)}</div>
                        <div class="category-tag">${escapeHtml(ci.category || 'Other')}</div>
                        ${rankBadgeHtml(rank)}
                    </div>
                    ${analysis.bottleneck_addressed ? `<div class="bottleneck">Focus: ${escapeHtml(analysis.bottleneck_addressed)}</div>` : ''}
                    ${analysis.problem_statement ? `<div class="problem"><strong>Problem:</strong> ${escapeHtml(analysis.problem_statement)}</div>` : ''}
                    ${(analysis.executive_summary || analysis.key_metrics?.primary_metric) ? `<details class="analysis-details"><summary>View analysis</summary>
                        ${analysis.executive_summary ? `<div class="summary">${escapeHtml(analysis.executive_summary)}</div>` : ''}
                        ${analysis.key_metrics?.primary_metric ? `<div class="paper-meta"><strong>Key result:</strong> ${escapeHtml(analysis.key_metrics.primary_metric)}</div>` : ''}
                    </details>` : ''}
                </article>`;
            }).join('');

            papersEl.innerHTML = `<div class="papers-grid">${html}</div>`;
        }

        window.addEventListener('load', loadDates);
    </script>
</body>
</html>
